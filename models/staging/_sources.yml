version: 2

sources:
  - name: payments_demo
    database: modus-playground
    schema: payments_demo
    description: >
      Raw payments platform dataset — 75+ tables covering AP/AR payments,
      card acquiring, KYC/risk, subscriptions, marketing, and product
      engagement. Generated synthetically for the Modus AI demo.

    tables:
      # ── Reference / Lookup ─────────────────────────────────────
      - name: countries
      - name: currencies
      - name: industries
      - name: mcc_codes
      - name: plans
      - name: partnerships
      - name: processors
      - name: roles
      - name: feature_flags
      - name: bank_lookup

      # ── Identity ───────────────────────────────────────────────
      - name: organizations
        description: Customer orgs — one row per account. Core entity for all analysis.
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: account_status
            tests:
              - name: accepted_values_org_status_source
                test_name: accepted_values
                config:
                  severity: warn
                arguments:
                  values:
                    - active
                    - past_due
                    - suspended
                    - churned
                    - trial
                    - trial_expired
                    - kyc_stalled
          - name: partner_id
            tests:
              - not_null
          - name: current_plan_id
            tests:
              - not_null

      - name: users
        description: Platform users — internal and customer-facing.
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: primary_organization_id
            tests:
              - not_null

      - name: user_organizations
      - name: user_roles
      - name: api_keys
      - name: sessions
      - name: login_attempts

      # ── Counterparties ─────────────────────────────────────────
      - name: counterparties
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: organization_id
            tests:
              - not_null
      - name: counterparty_addresses
      - name: counterparty_bank_accounts
      - name: counterparty_payment_preferences
      - name: registry_counterparties
        columns:
          - name: id
            tests:
              - unique
              - not_null
      - name: counterparty_registry_mapping

      # ── Bills & Invoices ───────────────────────────────────────
      - name: bills
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: organization_id
            tests:
              - not_null
          - name: status
            tests:
              - name: accepted_values_bill_status
                test_name: accepted_values
                config:
                  severity: warn
                arguments:
                  values:
                    - received
                    - pending_approval
                    - pending
                    - approved
                    - scheduled
                    - paid
                    - voided
                    - disputed
                    - canceled
                    - rejected

      - name: bill_lines
      - name: bill_approval_workflows
      - name: bill_approvals

      - name: invoices
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - name: accepted_values_invoice_status
                test_name: accepted_values
                config:
                  severity: warn
                arguments:
                  values:
                    - draft
                    - sent
                    - viewed
                    - paid
                    - overdue
                    - voided
                    - write_off
                    - partially_paid
                    - canceled
                    - uncollectible

      - name: invoice_lines
      - name: invoice_card_payment_links
      - name: ocr_extractions

      # ── Payments ───────────────────────────────────────────────
      - name: payment_methods
      - name: delivery_methods
      - name: payments
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - name: accepted_values_payment_status
                test_name: accepted_values
                config:
                  severity: warn
                arguments:
                  values:
                    - scheduled
                    - initiated
                    - processing
                    - completed
                    - failed
                    - canceled
                    - returned
                    - refunded
          - name: direction
            tests:
              - name: accepted_values_payment_direction_source
                test_name: accepted_values
                arguments:
                  values:
                    - outbound
                    - inbound
          - name: amount_usd
            tests:
              - not_null

      - name: bill_payments
      - name: invoice_payments
      - name: payment_attempts
      - name: payment_status_history
      - name: fx_rates
      - name: fx_conversions
      - name: ach_returns

      # ── Card Acquiring ─────────────────────────────────────────
      - name: card_transactions
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: transaction_type
            tests:
              - name: accepted_values_card_txn_type_source
                test_name: accepted_values
                arguments:
                  values:
                    - sale
                    - refund
                    - void
                    - auth
                    - capture
          - name: outcome
            tests:
              - name: accepted_values_card_outcome_source
                test_name: accepted_values
                arguments:
                  values:
                    - approved
                    - declined

      - name: chargebacks
        columns:
          - name: id
            tests:
              - unique
              - not_null

      - name: dispute_cases
      - name: dispute_evidence

      # ── Risk & Compliance ──────────────────────────────────────
      - name: kyc_kyb_checks
      - name: kyc_kyb_check_steps
      - name: fraud_scores
      - name: fraud_review_queue
      - name: fraud_decisions
      - name: sanctions_screenings
        columns:
          - name: outcome
            tests:
              - name: accepted_values_sanctions_outcome
                test_name: accepted_values
                arguments:
                  values:
                    - clear
                    - potential_match
                    - confirmed_match
      - name: risk_events

      # ── Operations ─────────────────────────────────────────────
      - name: support_tickets
        columns:
          - name: id
            tests:
              - unique
              - not_null

      - name: support_ticket_messages
      - name: csm_assignments
      - name: csm_activities

      # ── Internal Finance ───────────────────────────────────────
      - name: plan_features
      - name: subscriptions
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - name: accepted_values_subscription_status_source
                test_name: accepted_values
                config:
                  severity: warn
                arguments:
                  values:
                    - trialing
                    - active
                    - past_due
                    - paused
                    - canceled

      - name: subscription_usage
      - name: platform_invoices
      - name: platform_invoice_lines
      - name: revenue_recognition
      - name: cogs_entries
      - name: customer_health_scores

      # ── Marketing ──────────────────────────────────────────────
      - name: marketing_campaigns
      - name: campaign_attributions
      - name: emails
      - name: email_events

      # ── Product Engagement ─────────────────────────────────────
      - name: releases
      - name: release_notes
      - name: feature_flag_assignments
      - name: ui_events
      - name: page_views
      - name: page_errors

      # ── Audit ──────────────────────────────────────────────────
      - name: audit_log