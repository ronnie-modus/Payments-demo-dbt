version: 2

semantic_models:

  # ── Organizations ──────────────────────────────────────────────────────────
  - name: organizations
    description: "Customer organizations — one row per account."
    model: ref('mart_org_summary')
    defaults:
      agg_time_dimension: org_created_month

    dimensions:
      - name: org_created_month
        type: time
        type_params:
          time_granularity: month
      - name: account_status
        type: categorical
      - name: plan_tier
        type: categorical
      - name: partner_short_code
        type: categorical
      - name: industry_name
        type: categorical
      - name: industry_sector
        type: categorical
      - name: partnership_type
        type: categorical
      - name: is_churned
        type: categorical
      - name: is_active
        type: categorical
      - name: is_sleeping
        type: categorical
      - name: is_grandfathered
        type: categorical
      - name: is_bad_fit_campaign_org
        type: categorical
      - name: health_band
        type: categorical
      - name: primary_risk_signal
        type: categorical

    entities:
      - name: org
        type: primary
        expr: org_id

    measures:
      - name: org_count
        agg: count
        expr: org_id
        description: "Number of organizations."
      - name: total_mrr
        agg: sum
        expr: mrr_usd
        description: "Total MRR in USD."
      - name: total_arr
        agg: sum
        expr: arr_usd
        description: "Total ARR in USD."
      - name: avg_mrr
        agg: average
        expr: mrr_usd
        description: "Average MRR per org."
      - name: avg_health_score
        agg: average
        expr: health_score
        description: "Average health score (0-100)."
      - name: avg_churn_risk
        agg: average
        expr: churn_risk_score
        description: "Average churn risk score (0-1)."


  # ── Campaigns ──────────────────────────────────────────────────────────────
  - name: campaigns
    description: "Marketing campaigns with cohort churn metrics."
    model: ref('mart_campaign_cohort_churn')

    dimensions:
      - name: campaign_start_date
        type: time
        type_params:
          time_granularity: day
        expr: campaign_start_date
      - name: channel
        type: categorical
      - name: campaign_type
        type: categorical
      - name: is_bad_fit_campaign
        type: categorical

    entities:
      - name: campaign
        type: primary
        expr: campaign_id

    measures:
      - name: campaign_count
        agg: count
        expr: campaign_id
      - name: total_spend
        agg: sum
        expr: spend_usd
        description: "Total campaign spend in USD."
      - name: total_attributed_orgs
        agg: sum
        expr: attributed_orgs
      - name: total_churned_within_90d
        agg: sum
        expr: churned_within_90d
      - name: avg_churn_rate_90d
        agg: average
        expr: churn_rate_90d
        description: "Average 90-day churn rate across campaigns."
      - name: avg_cac
        agg: average
        expr: cac_usd
        description: "Average customer acquisition cost in USD."


  # ── Chargebacks ────────────────────────────────────────────────────────────
  - name: chargebacks
    description: "Monthly chargeback rates by industry."
    model: ref('mart_chargeback_rate_by_industry_month')
    defaults:
      agg_time_dimension: txn_month

    dimensions:
      - name: txn_month
        type: time
        type_params:
          time_granularity: month
      - name: industry_name
        type: categorical
      - name: sector
        type: categorical
      - name: is_subscription_box
        type: categorical

    entities:
      - name: industry_month
        type: primary
        expr: "CONCAT(industry_name, '_', CAST(txn_month AS STRING))"

    measures:
      - name: total_approved_sales
        agg: sum
        expr: approved_sale_count
      - name: total_chargebacks
        agg: sum
        expr: chargeback_count
      - name: total_lost_amount
        agg: sum
        expr: lost_amount_usd
        description: "Total chargeback losses in USD."
      - name: avg_chargeback_rate
        agg: average
        expr: chargeback_rate
        description: "Average chargeback rate (chargebacks / approved sales)."


  # ── Card Interchange ───────────────────────────────────────────────────────
  - name: card_interchange
    description: "Monthly card interchange costs and volume by processor."
    model: ref('mart_card_interchange_by_processor_month')
    defaults:
      agg_time_dimension: txn_month

    dimensions:
      - name: txn_month
        type: time
        type_params:
          time_granularity: month
      - name: processor_name
        type: categorical
      - name: processor_type
        type: categorical
      - name: mcc_category
        type: categorical
      - name: plan_tier
        type: categorical
      - name: partner_short_code
        type: categorical

    entities:
      - name: processor_month
        type: primary
        expr: "CONCAT(processor_name, '_', CAST(txn_month AS STRING))"

    measures:
      - name: total_txn_count
        agg: sum
        expr: txn_count
      - name: total_volume
        agg: sum
        expr: volume_usd
        description: "Total card transaction volume in USD."
      - name: total_interchange_cost
        agg: sum
        expr: total_interchange_usd
        description: "Total interchange cost in USD."
      - name: avg_interchange_bps
        agg: average
        expr: avg_interchange_bps
        description: "Average interchange rate in basis points."
      - name: avg_helios_volume_share
        agg: average
        expr: helios_volume_share
        description: "Average share of volume routed through Helios Acquiring."


  # ── Support Tickets ────────────────────────────────────────────────────────
  - name: support_tickets
    description: "Weekly support ticket volume by feature area."
    model: ref('mart_support_tickets_by_feature_week')
    defaults:
      agg_time_dimension: ticket_week

    dimensions:
      - name: ticket_week
        type: time
        type_params:
          time_granularity: week
      - name: feature_area
        type: categorical
      - name: category
        type: categorical
      - name: priority
        type: categorical
      - name: channel
        type: categorical
      - name: in_spike_window
        type: categorical

    entities:
      - name: feature_week
        type: primary
        expr: "CONCAT(feature_area, '_', CAST(ticket_week AS STRING))"

    measures:
      - name: total_tickets
        agg: sum
        expr: ticket_count
      - name: total_resolved
        agg: sum
        expr: resolved_count
      - name: total_sla_breached
        agg: sum
        expr: sla_breached_count
      - name: total_negative_sentiment
        agg: sum
        expr: negative_sentiment_count
      - name: avg_hours_to_resolve
        agg: average
        expr: avg_hours_to_resolve
      - name: avg_csat
        agg: average
        expr: avg_csat
      - name: total_v418_linked_tickets
        agg: sum
        expr: linked_to_v418


metrics:

  # ── Organization metrics ───────────────────────────────────────────────────
  - name: total_mrr
    label: "Total MRR"
    description: "Total monthly recurring revenue across all active orgs."
    type: simple
    type_params:
      measure: total_mrr

  - name: total_arr
    label: "Total ARR"
    description: "Total annual recurring revenue."
    type: simple
    type_params:
      measure: total_arr

  - name: org_count
    label: "Organization Count"
    description: "Total number of customer organizations."
    type: simple
    type_params:
      measure: org_count

  - name: avg_mrr_per_org
    label: "Avg MRR per Org"
    description: "Average MRR per organization."
    type: simple
    type_params:
      measure: avg_mrr

  - name: avg_health_score
    label: "Avg Health Score"
    description: "Average customer health score (0-100)."
    type: simple
    type_params:
      measure: avg_health_score

  - name: avg_churn_risk
    label: "Avg Churn Risk Score"
    description: "Average churn risk score (0-1)."
    type: simple
    type_params:
      measure: avg_churn_risk

  # ── Campaign metrics ───────────────────────────────────────────────────────
  - name: total_campaign_spend
    label: "Total Campaign Spend"
    description: "Total marketing spend across all campaigns."
    type: simple
    type_params:
      measure: total_spend

  - name: avg_cac
    label: "Avg Customer Acquisition Cost"
    description: "Average CAC across campaigns in USD."
    type: simple
    type_params:
      measure: avg_cac

  - name: avg_churn_rate_90d
    label: "Avg 90-Day Churn Rate"
    description: "Average 90-day post-acquisition churn rate."
    type: simple
    type_params:
      measure: avg_churn_rate_90d

  # ── Chargeback metrics ─────────────────────────────────────────────────────
  - name: avg_chargeback_rate
    label: "Avg Chargeback Rate"
    description: "Average chargeback rate across industries and months."
    type: simple
    type_params:
      measure: avg_chargeback_rate

  - name: total_chargeback_losses
    label: "Total Chargeback Losses"
    description: "Total lost amount from chargebacks in USD."
    type: simple
    type_params:
      measure: total_lost_amount

  # ── Interchange metrics ────────────────────────────────────────────────────
  - name: total_card_volume
    label: "Total Card Volume"
    description: "Total card transaction volume in USD."
    type: simple
    type_params:
      measure: total_volume

  - name: total_interchange_cost
    label: "Total Interchange Cost"
    description: "Total interchange cost in USD."
    type: simple
    type_params:
      measure: total_interchange_cost

  - name: avg_helios_volume_share
    label: "Avg Helios Volume Share"
    description: "Average share of card volume routed through Helios Acquiring."
    type: simple
    type_params:
      measure: avg_helios_volume_share

  # ── Support metrics ────────────────────────────────────────────────────────
  - name: total_support_tickets
    label: "Total Support Tickets"
    description: "Total support ticket volume."
    type: simple
    type_params:
      measure: total_tickets

  - name: sla_breach_count
    label: "SLA Breach Count"
    description: "Total number of SLA-breached tickets."
    type: simple
    type_params:
      measure: total_sla_breached

  - name: avg_hours_to_resolve
    label: "Avg Hours to Resolve"
    description: "Average ticket resolution time in hours."
    type: simple
    type_params:
      measure: avg_hours_to_resolve
