version: 2

models:
  - name: mart_org_summary
    description: >
      One row per customer org. Primary entity table used by all 6 skills.
      Joins organizations, plans, partnerships, industries, latest subscription,
      and latest health score. Partitioned by org_created_month.
    semantic_model:
      enabled: true
    agg_time_dimension: org_created_month
    columns:
      - name: org_id
        tests:
          - unique
          - not_null
        entity:
          type: primary
          name: org
      - name: org_created_month
        granularity: month
        dimension:
          type: time
      - name: account_status
        tests:
          - name: accepted_values_org_account_status
            test_name: accepted_values
            config:
              severity: warn
            arguments:
              values:
                - active
                - past_due
                - suspended
                - churned
                - trial
                - trial_expired
                - kyc_stalled
        dimension:
          type: categorical
      - name: plan_tier
        tests:
          - name: accepted_values_org_plan_tier
            test_name: accepted_values
            config:
              severity: warn
            arguments:
              values:
                - trial
                - starter
                - growth
                - growth_2025
                - business
                - enterprise
                - legacy_2023
        dimension:
          type: categorical
      - name: partner_short_code
        dimension:
          type: categorical
      - name: industry_name
        dimension:
          type: categorical
      - name: health_band
        dimension:
          type: categorical
      - name: is_churned
        dimension:
          type: categorical
      - name: is_sleeping
        description: "True when primary_risk_signal = 'sleeping' on latest health score (story #15)."
        dimension:
          type: categorical
      - name: is_bad_fit_campaign_org
        description: "Flags orgs from the LinkedIn Manufacturing bad-fit campaign (story #14)."
        dimension:
          type: categorical
      - name: is_grandfathered
        description: "True for legacy_2023 orgs with unlimited_usage (story #11)."
      - name: mrr_usd
        tests:
          - not_null
        description: "Monthly recurring revenue in USD."
      - name: arr_usd
      - name: health_score
        tests:
          - name: not_null_health_score
            test_name: not_null
            config:
              severity: warn
        description: "Composite health score 0-100. Null for orgs with no health snapshots yet."
      - name: churn_risk_score
    metrics:
      - name: org_count
        label: "Organization Count"
        type: simple
        agg: count
        expr: org_id
      - name: total_mrr
        label: "Total MRR (USD)"
        type: simple
        agg: sum
        expr: mrr_usd
      - name: total_arr
        label: "Total ARR (USD)"
        type: simple
        agg: sum
        expr: arr_usd
      - name: avg_mrr_per_org
        label: "Avg MRR per Org"
        type: simple
        agg: average
        expr: mrr_usd
      - name: avg_health_score
        label: "Avg Health Score"
        type: simple
        agg: average
        expr: health_score
      - name: avg_churn_risk
        label: "Avg Churn Risk Score"
        type: simple
        agg: average
        expr: churn_risk_score

  - name: mart_campaign_cohort_churn
    description: >
      One row per marketing campaign. Includes 90-day churn rate, CAC,
      and average org MRR. Campaign 310000017 is the bad-fit benchmark (story #14).
    semantic_model:
      enabled: true
    agg_time_dimension: campaign_start_date
    columns:
      - name: campaign_id
        tests:
          - unique
          - not_null
        entity:
          type: primary
          name: campaign
      - name: campaign_start_date
        granularity: day
        dimension:
          type: time
      - name: channel
        dimension:
          type: categorical
      - name: campaign_type
        dimension:
          type: categorical
      - name: is_bad_fit_campaign
        description: "True for campaign id=310000017 — the high-churn cohort anchor."
        dimension:
          type: categorical
      - name: spend_usd
      - name: attributed_orgs
      - name: churned_within_90d
      - name: churn_rate_90d
        tests:
          - name: not_null_churn_rate
            test_name: not_null
            config:
              severity: warn
        description: "90-day churn rate. Should be ~2x baseline for campaign 310000017."
      - name: cac_usd
    metrics:
      - name: total_campaign_spend
        label: "Total Campaign Spend (USD)"
        type: simple
        agg: sum
        expr: spend_usd
      - name: total_attributed_orgs
        label: "Total Attributed Orgs"
        type: simple
        agg: sum
        expr: attributed_orgs
      - name: total_churned_within_90d
        label: "Total Churned Within 90d"
        type: simple
        agg: sum
        expr: churned_within_90d
      - name: avg_churn_rate_90d
        label: "Avg 90-Day Churn Rate"
        type: simple
        agg: average
        expr: churn_rate_90d
      - name: avg_cac
        label: "Avg Customer Acquisition Cost"
        type: simple
        agg: average
        expr: cac_usd

  - name: mart_chargeback_rate_by_industry_month
    description: >
      Monthly chargeback rate by industry. The Subscription Box industry ramps
      from 0.4% to 2.2% between Jan 2025 and May 2026 (story #3).
    semantic_model:
      enabled: true
    agg_time_dimension: txn_month
    columns:
      - name: industry_month_key
        entity:
          type: primary
          name: industry_month
      - name: txn_month
        granularity: month
        dimension:
          type: time
      - name: industry_name
        dimension:
          type: categorical
      - name: sector
        dimension:
          type: categorical
      - name: is_subscription_box
        description: "Flags the Subscription Box / DTC Recurring industry (story #3)."
        dimension:
          type: categorical
      - name: approved_sale_count
      - name: chargeback_count
      - name: lost_amount_usd
      - name: chargeback_rate
        tests:
          - not_null
        description: "CB rate = chargebacks / approved sales."
    metrics:
      - name: total_approved_sales
        label: "Total Approved Sales"
        type: simple
        agg: sum
        expr: approved_sale_count
      - name: total_chargebacks
        label: "Total Chargebacks"
        type: simple
        agg: sum
        expr: chargeback_count
      - name: total_chargeback_losses
        label: "Total Chargeback Losses (USD)"
        type: simple
        agg: sum
        expr: lost_amount_usd
      - name: avg_chargeback_rate
        label: "Avg Chargeback Rate"
        type: simple
        agg: average
        expr: chargeback_rate

  - name: mart_card_interchange_by_processor_month
    description: >
      Monthly card interchange COGS and volume by processor and MCC category.
      helios_volume_share is the primary story #10 metric — rises post-2025-06.
    semantic_model:
      enabled: true
    agg_time_dimension: txn_month
    columns:
      - name: processor_month_key
        entity:
          type: primary
          name: processor_month
      - name: txn_month
        granularity: month
        dimension:
          type: time
      - name: processor_name
        dimension:
          type: categorical
      - name: mcc_category
        dimension:
          type: categorical
      - name: plan_tier
        dimension:
          type: categorical
      - name: partner_short_code
        dimension:
          type: categorical
      - name: txn_count
      - name: volume_usd
      - name: total_interchange_usd
      - name: avg_interchange_bps
        tests:
          - not_null
        description: "Average interchange rate in basis points."
      - name: helios_volume_share
        tests:
          - not_null
        description: "Share of approved sale volume routed through Helios Acquiring."
    metrics:
      - name: total_card_txn_count
        label: "Total Card Transactions"
        type: simple
        agg: sum
        expr: txn_count
      - name: total_card_volume
        label: "Total Card Volume (USD)"
        type: simple
        agg: sum
        expr: volume_usd
      - name: total_interchange_cost
        label: "Total Interchange Cost (USD)"
        type: simple
        agg: sum
        expr: total_interchange_usd
      - name: avg_interchange_bps
        label: "Avg Interchange (bps)"
        type: simple
        agg: average
        expr: avg_interchange_bps
      - name: avg_helios_volume_share
        label: "Avg Helios Volume Share"
        type: simple
        agg: average
        expr: helios_volume_share

  - name: mart_activation_funnel
    description: >
      One row per org. Reconstructs the full registration to first completed
      payment funnel. Excludes orgs created in the last 30 days.
    columns:
      - name: org_id
        tests:
          - unique
          - not_null
      - name: legal_details_attempts
        description: "Number of KYC attempts at the legal_details step."
      - name: had_legal_details_retry
        description: "True if the org needed more than one attempt at legal_details."
      - name: completed_first_payment
        description: "Primary activation metric — TRUE means org is activated."

  - name: mart_support_tickets_by_feature_week
    description: >
      Weekly ticket volume aggregated by feature area, category, and priority.
      in_spike_window flags the Aug 15-25 2025 OCR regression window (story #8).
    semantic_model:
      enabled: true
    agg_time_dimension: ticket_week
    columns:
      - name: feature_week_key
        entity:
          type: primary
          name: feature_week
      - name: ticket_week
        granularity: week
        dimension:
          type: time
      - name: feature_area
        dimension:
          type: categorical
      - name: category
        dimension:
          type: categorical
      - name: priority
        dimension:
          type: categorical
      - name: channel
        dimension:
          type: categorical
      - name: in_spike_window
        description: "True for the week containing the v4.18 OCR support spike."
        dimension:
          type: categorical
      - name: linked_to_v418
        description: "Count of tickets directly linked to release 520000018."
      - name: ticket_count
      - name: resolved_count
      - name: sla_breached_count
      - name: avg_hours_to_resolve
      - name: avg_csat
    metrics:
      - name: total_support_tickets
        label: "Total Support Tickets"
        type: simple
        agg: sum
        expr: ticket_count
      - name: total_resolved_tickets
        label: "Total Resolved Tickets"
        type: simple
        agg: sum
        expr: resolved_count
      - name: sla_breach_count
        label: "SLA Breach Count"
        type: simple
        agg: sum
        expr: sla_breached_count
      - name: avg_hours_to_resolve
        label: "Avg Hours to Resolve"
        type: simple
        agg: average
        expr: avg_hours_to_resolve
      - name: avg_csat_score
        label: "Avg CSAT Score"
        type: simple
        agg: average
        expr: avg_csat
      - name: time_spine_daily
        description: "Daily time spine required by MetricFlow."
        time_spine:
          standard_granularity_column: date_day
        columns:
          - name: date_day
            granularity: day
